<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0f0f0f"/>
  <!-- card body -->
  <rect x="8" y="18" width="48" height="30" rx="6" fill="url(#cg)"/>
  <!-- magnetic stripe -->
  <rect x="8" y="26" width="48" height="9" fill="rgba(0,0,0,0.35)"/>
  <!-- chip -->
  <rect x="13" y="33" width="10" height="8" rx="2" fill="#f59e0b" opacity="0.9"/>
  <!-- dots -->
  <circle cx="38" cy="40" r="2.5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="44" cy="40" r="2.5" fill="rgba(255,255,255,0.7)"/>
  <circle cx="50" cy="40" r="2.5" fill="rgba(255,255,255,0.9)"/>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4286f4"/>
      <stop offset="100%" stop-color="#34e89e"/>
    </linearGradient>
  </defs>
</svg>
